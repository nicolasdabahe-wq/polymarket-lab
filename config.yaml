# Configuración del bot. Las claves/secretos van en .env, nunca aquí.

capital:
  # Capital inicial simulado en modo paper (USDC).
  # 270 ≈ 5.000 MXN: el paper simula exactamente el capital real planeado,
  # así los resultados son representativos (mínimos de orden incluidos).
  paper_starting_usdc: 270.0

data:
  # Mercados a cachear por corrida (ordenados por volumen 24h desc).
  max_markets: 600
  page_size: 100
  # Ignorar mercados con liquidez menor a esto (USDC).
  min_liquidity: 500.0

smart_money:
  # Cuántas filas del leaderboard traer por ventana.
  leaderboard_limit: 50
  # Pesos del score compuesto (deben sumar ~1.0 junto con roi/diversificación).
  # Perfil "racha": la última semana pesa más que el historial largo, para
  # subir al ranking a los que están finos AHORA.
  weights:
    pnl_day: 0.10             # racha de HOY
    pnl_week: 0.25
    pnl_month: 0.25
    pnl_all: 0.10
    roi: 0.12
    diversification: 0.18
  # Filtros duros: wallets que no los pasan quedan fuera del ranking.
  filters:
    min_trades: 20          # nº mínimo de operaciones históricas visibles
    min_distinct_markets: 5 # descarta "one-trick ponies" / posibles insiders
    min_account_age_days: 15  # permite rachas recientes (con 30 se escapaban)
  # Cuántas wallets del ranking final monitorear de cerca.
  top_n: 40
  # Máximo de posiciones a listar por wallet.
  positions_per_wallet: 25
  # Validación automática por backtest: decide a quién SÍ conviene copiar.
  # El leaderboard dice quién gana; esto dice a quién podemos replicar.
  validation:
    enabled: true
    days: 30                # ventana del backtest
    stake_usdc: 16          # tamaño simulado por copia
    # Umbrales de tamaño a probar: se elige el más rentable por wallet
    # (muchas ganan solo en sus apuestas de convicción).
    # Se prueban todos y se elige el mejor CON muestra suficiente. Los
    # umbrales altos importan para las ballenas: BreakTheBank rinde +15.1%
    # copiando solo lo que mete arriba de $2.000, y sigue en positivo a
    # $5.000 y $10.000.
    thresholds: [150, 300, 500, 1000, 2000, 5000]
    min_roi: 0.0            # habilita si copiarla habría dado >= 0%
    # Muestra mínima por umbral. Con 5 cualquiera parece un genio:
    # sainttroplay mostraba +77.5% con SEIS copias y rn1 +23.8% con UNA.
    # Con 20, solo hablan las wallets que de verdad demostraron algo.
    min_copies: 20
    # Cuántas backtestear por corrida. La cola rota: primero las que nunca
    # tuvieron veredicto (por actividad), después las más viejas de revisar,
    # así el universo entero se cubre con el tiempo.
    max_wallets_per_run: 60
    revalidate_hours: 24
    # Descubrimiento. Tres fuentes que solo APORTAN nombres, ninguna
    # descarta: el veredicto siempre lo da el backtest.
    discovery:
      enabled: true
      markets: 25             # mercados top de los que mirar holders
      holders_per_market: 15
      max_candidates: 60      # candidatas nuevas por corrida
      # Universo de la cinta: toda wallet que se vea operando por encima de
      # este monto entra a la cola de evaluación, tenga o no historial
      # visible. El leaderboard muestra a los famosos; esto muestra a quien
      # está moviendo dinero ahora.
      candidate_min_usdc: 500

intel:
  # Feeds RSS a vigilar. category debe coincidir con las categorías de mercados.
  feeds:
    - {name: BBC World,        url: "https://feeds.bbci.co.uk/news/world/rss.xml",                          category: geopolitics}
    - {name: BBC Politics,     url: "https://feeds.bbci.co.uk/news/politics/rss.xml",                      category: politics}
    - {name: NYT Politics,     url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml",           category: politics}
    - {name: NYT World,        url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",              category: geopolitics}
    - {name: NYT Economy,      url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml",            category: economy}
    - {name: The Guardian US,  url: "https://www.theguardian.com/us-news/rss",                              category: politics}
    - {name: The Guardian World, url: "https://www.theguardian.com/world/rss",                              category: geopolitics}
    - {name: CNBC Economy,     url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", category: economy}
    - {name: CoinDesk,         url: "https://www.coindesk.com/arc/outboundfeeds/rss/",                      category: crypto}
    - {name: ESPN Top,         url: "https://www.espn.com/espn/rss/news",                                   category: sports}
  # Máx. ítems nuevos a procesar por feed y por corrida.
  max_items_per_feed: 20
  # Antigüedad máxima de una noticia para analizarla (horas).
  max_age_hours: 36
  llm:
    enabled: true
    # Haiku para clasificar noticias: la tarea es mapear noticia->mercado,
    # no razonar. Con Opus el crédito de $5 se consumía en ~3 días.
    model: claude-haiku-4-5
    # Máx. noticias a analizar con LLM por corrida (control de costos).
    max_news_per_run: 12
    # Máx. mercados candidatos que se le muestran al LLM por noticia.
    candidate_markets: 8

scheduler:
  # Hora UTC de la rutina diaria completa (HH:MM).
  daily_run_utc: "11:00"
  # Polls intradía (minutos). Copias y arbitraje necesitan reacción rápida;
  # noticias no (y el LLM cuesta por corrida).
  intel_poll_minutes: 10
  # CARRIL RÁPIDO: las mejores wallets validadas, vigiladas segundo a
  # segundo con /activity (el endpoint fresco: cache de 15s). Medido el
  # 2026-08-22: 12 wallets se consultan en 0.7s sin rate-limit.
  # Aquí es donde se evita llegar tarde y que el precio "vuele".
  fast_lane_seconds: 15
  fast_lane_wallets: 12
  # Red media: una sola llamada trae todos los trades grandes del sitio y
  # cubre a las wallets fuera del carril rápido. OJO: ese endpoint viene
  # cacheado 300s y el dato trae 1-2 min de atraso, no sirve para correr.
  tape_poll_seconds: 60
  # Barrido completo de todas las wallets vigiladas: la red de seguridad.
  smart_money_poll_minutes: 5
  markets_refresh_minutes: 5
  # Consenso de posiciones sostenidas: refresco de carteras + chequeo.
  # 10 min es el óptimo: las carteras cambian lento y más frecuencia solo
  # provoca rate-limits (429) que frenan TODOS los polls con reintentos.
  holdings_consensus_minutes: 10
  # Modelo deportivo propio contra el precio del mercado.
  sports_poll_minutes: 20
  # Reconciliación con la blockchain (adopta fills tardíos) y liquidación
  # de mercados resueltos.
  reconcile_minutes: 5

telegram:
  # Con enabled: true pero sin token/chat_id en .env, degrada a log (no rompe).
  enabled: true

risk:
  # Límites duros: ninguna orden (ni paper ni real) se ejecuta sin pasarlos.
  # Perfil AGRESIVO pedido explícitamente por el dueño (2026-08-21):
  # una posición puede llegar a ~20% del capital y el stop diario es 10%.
  max_pct_per_market: 0.20
  max_pct_per_copied_wallet: 0.25
  max_pct_per_category: 0.50
  max_total_exposure_pct: 0.85
  # Con apuestas de ~$14, un stop del 10% se alcanzaba con 2 posiciones
  # perdidas: demasiado pronto. 20% da margen para ~4 antes de frenar el día.
  daily_stop_loss_pct: 0.20
  min_order_usdc: 10.0      # piso por apuesta pedido por el dueño
  # Freno TOTAL: a diferencia del stop diario (que se reinicia cada día UTC),
  # este no se levanta solo. Protege el capital cuando nadie está mirando.
  # 60% => el bot para de comprar si el equity baja de ~$112.
  # Decisión explícita del dueño (2026-08-21), advertido del alcance.
  max_drawdown_pct: 0.60
  # VELOCIDAD DEL CAPITAL. Con una cuenta chica el dinero parado es el
  # enemigo silencioso: no pierde, pero tampoco compone. Una apuesta a un
  # senador que se define en noviembre secuestra munición que en ese tiempo
  # podría dar diez vueltas. Decisión del dueño (2026-08-22).
  max_days_to_resolution: 21   # nada que tarde más de tres semanas
  # "Lenta" es más de doce días, no más de una semana: con siete, los
  # mercados de cripto de fin de mes (que a 10 días son los que MÁS están
  # rindiendo) contaban como capital muerto y bloqueaban a la estrategia
  # que mejor funciona. Calibrado con la cartera real del 2026-08-22.
  slow_days: 12
  max_pct_slow: 0.20           # máximo 20% del capital dormido
  # Kill switch manual: crear el archivo var/KILL (o PMBOT_KILL=1) bloquea
  # toda compra nueva; las ventas siguen permitidas.

execution:
  # Fee taker en bps aplicado en la simulación (Polymarket hoy no cobra fee
  # en la mayoría de mercados; subir si operás mercados con fee).
  taker_fee_bps: 0

strategies:
  arbitrage:
    enabled: true
    budget_pct: 0.30          # máx fracción del equity en esta estrategia
    min_edge: 0.01            # edge mínimo neto (1%) para entrar
    max_usdc_per_trade: 50    # risk/ igual re-verifica contra el 20% por mercado
    min_usdc_per_trade: 12
    scan_top_markets: 300
  copy_trading:
    enabled: true
    budget_pct: 0.50
    # El tamaño ya NO es fijo: escala con la ventaja estimada (sizing.py).
    # Kelly fraccionado sobre el retorno esperado, que sale del ROI que dio
    # copiar a esa wallet en el backtest, ajustado por consenso y slippage.
    kelly_fraction: 0.25        # 25% de Kelly: nuestras probabilidades son ruidosas
    max_trade_pct: 0.12         # techo por apuesta (~$29 con $240)
    default_roi_untested: 0.05  # wallets sin backtest: ventaja conservadora
    consensus_boost: 0.4        # cada wallet extra que coincide suma 40%
    min_trade_usdc: 12.0      # piso por copia
    max_slippage_pct: 0.10    # no copiar si el precio subió >10% desde su entrada
    # Escudo sharp: no copiar pagando más que la línea de las casas
    # profesionales + esta tolerancia. La primera noche se compró NO de
    # Brentford a 0.58 con la línea en 0.535: 4,5 puntos regalados.
    sharp_tolerance: 0.04
    sharp_max_age_hours: 8
    # Techo de entrada. Comprar a 0.95 es arriesgar $13 para ganar $0.60:
    # hay que acertar 19 de 20 solo para empatar. Con la primera noche real
    # (2026-08-22) las entradas caras dieron +0.50/+0.60 cuando ganaban y
    # -13 cuando perdían. A 0.75 se arriesga $12 para ganar $4: pide acertar
    # 3 de cada 4 y paga en consecuencia. Número elegido por el dueño.
    max_entry_price: 0.75
    # El en vivo SÍ se copia: decisión del dueño (2026-08-22). Lo que hacía
    # daño no era el en vivo sino el precio al que entraba. El techo de
    # arriba y el tope de slippage son los que cuidan la entrada.
    sports_only_prematch: false
    min_wallet_score: 0.22
    min_copy_usdc_of_wallet: 150   # ignorar trades chicos de la wallet
    # Score a partir del cual se copia aunque el backtest aún no la validó.
    trust_without_backtest: 0.60
    strong_score: 0.65        # una sola wallet dispara si score>=0.65
    strong_usdc: 1500         # ... y entró con >= 1500 USDC
    solo_big_usdc: 2500       # cualquier calificada dispara sola si mete >= 2500
    confirm_count: 2          # o si >=2 wallets calificadas coinciden
    # Lista negra manual: solo para vetos permanentes. El filtro real lo hace
    # smart_money.validation (backtest diario que decide y busca el umbral
    # óptimo por wallet); mantenerlas acá duplicaría y contradiría ese juicio.
    wallet_blacklist:
      - "0x6d20c35f65d9899b6d6b74f8466e824580f9a165"  # Djdjdjekekek: -20% con todos los umbrales (esports en vivo)
    # Consenso de posiciones (rutina diaria): entrar cuando >=N wallets top
    # SOSTIENEN la misma posición grande en mercados lentos, aunque no
    # hayamos visto el trade en vivo. Complementa la copia en tiempo real.
    holdings_consensus:
      enabled: true
      min_wallets: 2
      min_value_usdc: 1500        # posición mínima de cada wallet
      categories: [politics, economy, geopolitics, crypto, sports]
      # Deportes SOLO antes del inicio del partido (en vivo es incopiable).
      sports_only_prematch: true
      max_entry_price: 0.80
  news_trading:
    enabled: false            # fase 3: requiere ANTHROPIC_API_KEY y research/
  # Arbitraje de escalera: contradicciones lógicas entre mercados hermanos.
  # Si "¿BTC llega a $150k?" cuesta MENOS que "¿BTC llega a $160k?" (mismo
  # vencimiento), comprar el YES del grande y el NO del chico paga $1 o $2
  # y nunca menos de lo invertido. Encontrado en vivo el 2026-08-22 en BTC
  # y XRP. No opina sobre nada: es aritmética.
  ladder_arb:
    enabled: true
    budget_pct: 0.30
    min_edge: 0.015          # 1,5% asegurado como mínimo para mover dos patas
    max_usdc_per_pair: 60
    min_usdc_per_pair: 12
  # Valor en deportes: NUESTRO propio modelo contra el precio del mercado.
  # No intenta adivinar mejor que las casas de apuestas (imposible), sino
  # detectar cuándo Polymarket se aleja mucho de un número razonable: juegos
  # de poco volumen, líneas recién abiertas, mercados que nadie mira.
  # Insumos, todos de la API oficial y gratis de la MLB:
  #   · expectativa pitagórica (carreras a favor/en contra, mejor que el récord)
  #   · fórmula Log5 para el enfrentamiento
  #   · ERA del abridor probable contra el promedio de la liga
  #   · ventaja de local
  sports_value:
    enabled: true
    budget_pct: 0.25
    min_edge: 0.08          # el modelo debe discrepar >= 8 puntos del libro
    max_entry_price: 0.75
    min_trade_usdc: 12.0
    kelly_fraction: 0.25
    max_trade_pct: 0.12
    # El abridor se cuenta a media fuerza: la pitagórica del equipo ya lo
    # incluye en su temporada, contarlo entero sería contarlo dos veces.
    peso_pitcher: 0.5
    ventaja_local: 0.035    # el local en MLB gana ~54% de los juegos
    # Solo antes del primer lanzamiento: el modelo no sabe el marcador.
    min_minutos_antes: 15
    # Fútbol con línea sharp: se comparan estas ligas contra los mercados
    # "Will X win?" de Polymarket. En fútbol NO hay modelo propio de
    # respaldo: sin línea no se opina (el empate rompe las heurísticas).
    # Cada liga cuesta 1 crédito por consulta (cache 6h): con tres ligas
    # más MLB son ~480/mes de los 500 del tier gratis.
    soccer_leagues:
      - soccer_epl
      - soccer_mexico_ligamx
      - soccer_italy_serie_a
  # Valor en cripto: modelo de opciones (precio spot + volatilidad real de
  # Coinbase) vs la probabilidad implícita del mercado de Polymarket.
  crypto_value:
    enabled: true
    budget_pct: 0.20
    base_pct_per_trade: 0.05
    min_trade_usdc: 12.0
    min_edge: 0.08            # el modelo debe discrepar >=8 puntos de prob.
    max_entry_price: 0.85
    min_days_to_resolution: 0.5
    max_days_to_resolution: 21   # alineado con el límite global de velocidad
    vol_lookback_days: 30

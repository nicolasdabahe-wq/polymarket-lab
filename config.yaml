# Configuración del bot. Las claves/secretos van en .env, nunca aquí.

capital:
  # Capital inicial simulado en modo paper (USDC).
  # 270 ≈ 5.000 MXN: el paper simula exactamente el capital real planeado,
  # así los resultados son representativos (mínimos de orden incluidos).
  paper_starting_usdc: 270.0

data:
  # Mercados a cachear por corrida (ordenados por volumen 24h desc).
  max_markets: 600
  page_size: 100
  # Ignorar mercados con liquidez menor a esto (USDC).
  min_liquidity: 500.0

smart_money:
  # Cuántas filas del leaderboard traer por ventana.
  leaderboard_limit: 50
  # Pesos del score compuesto (deben sumar ~1.0 junto con roi/diversificación).
  # Perfil "racha": la última semana pesa más que el historial largo, para
  # subir al ranking a los que están finos AHORA.
  weights:
    pnl_day: 0.10             # racha de HOY
    pnl_week: 0.25
    pnl_month: 0.25
    pnl_all: 0.10
    roi: 0.12
    diversification: 0.18
  # Filtros duros: wallets que no los pasan quedan fuera del ranking.
  filters:
    min_trades: 20          # nº mínimo de operaciones históricas visibles
    min_distinct_markets: 5 # descarta "one-trick ponies" / posibles insiders
    min_account_age_days: 15  # permite rachas recientes (con 30 se escapaban)
  # Cuántas wallets del ranking final monitorear de cerca.
  top_n: 20
  # Máximo de posiciones a listar por wallet.
  positions_per_wallet: 25

intel:
  # Feeds RSS a vigilar. category debe coincidir con las categorías de mercados.
  feeds:
    - {name: BBC World,        url: "https://feeds.bbci.co.uk/news/world/rss.xml",                          category: geopolitics}
    - {name: BBC Politics,     url: "https://feeds.bbci.co.uk/news/politics/rss.xml",                      category: politics}
    - {name: NYT Politics,     url: "https://rss.nytimes.com/services/xml/rss/nyt/Politics.xml",           category: politics}
    - {name: NYT World,        url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml",              category: geopolitics}
    - {name: NYT Economy,      url: "https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml",            category: economy}
    - {name: The Guardian US,  url: "https://www.theguardian.com/us-news/rss",                              category: politics}
    - {name: The Guardian World, url: "https://www.theguardian.com/world/rss",                              category: geopolitics}
    - {name: CNBC Economy,     url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258", category: economy}
    - {name: CoinDesk,         url: "https://www.coindesk.com/arc/outboundfeeds/rss/",                      category: crypto}
    - {name: ESPN Top,         url: "https://www.espn.com/espn/rss/news",                                   category: sports}
  # Máx. ítems nuevos a procesar por feed y por corrida.
  max_items_per_feed: 20
  # Antigüedad máxima de una noticia para analizarla (horas).
  max_age_hours: 36
  llm:
    enabled: true
    model: claude-opus-5
    effort: low            # análisis de noticias no necesita razonamiento máximo
    # Máx. noticias a analizar con LLM por corrida (control de costos).
    max_news_per_run: 20
    # Máx. mercados candidatos que se le muestran al LLM por noticia.
    candidate_markets: 8

scheduler:
  # Hora UTC de la rutina diaria completa (HH:MM).
  daily_run_utc: "11:00"
  # Polls intradía (minutos). Copias y arbitraje necesitan reacción rápida;
  # noticias no (y el LLM cuesta por corrida).
  intel_poll_minutes: 10
  smart_money_poll_minutes: 3
  markets_refresh_minutes: 5
  # Consenso de posiciones sostenidas: refresco de carteras + chequeo.
  # 10 min es el óptimo: las carteras cambian lento y más frecuencia solo
  # provoca rate-limits (429) que frenan TODOS los polls con reintentos.
  holdings_consensus_minutes: 10

telegram:
  # Con enabled: true pero sin token/chat_id en .env, degrada a log (no rompe).
  enabled: true

risk:
  # Límites duros: ninguna orden (ni paper ni real) se ejecuta sin pasarlos.
  # Perfil AGRESIVO pedido explícitamente por el dueño (2026-08-21):
  # una posición puede llegar a ~20% del capital y el stop diario es 10%.
  max_pct_per_market: 0.20
  max_pct_per_copied_wallet: 0.25
  max_pct_per_category: 0.50
  max_total_exposure_pct: 0.85
  daily_stop_loss_pct: 0.10
  min_order_usdc: 1.0
  # Kill switch manual: crear el archivo var/KILL (o PMBOT_KILL=1) bloquea
  # toda compra nueva; las ventas siguen permitidas.

execution:
  # Fee taker en bps aplicado en la simulación (Polymarket hoy no cobra fee
  # en la mayoría de mercados; subir si operás mercados con fee).
  taker_fee_bps: 0

strategies:
  arbitrage:
    enabled: true
    budget_pct: 0.30          # máx fracción del equity en esta estrategia
    min_edge: 0.01            # edge mínimo neto (1%) para entrar
    max_usdc_per_trade: 50    # risk/ igual re-verifica contra el 20% por mercado
    scan_top_markets: 300
  copy_trading:
    enabled: true
    budget_pct: 0.50
    base_pct_per_trade: 0.06  # tamaño base por copia (fracción del equity)
    max_slippage_pct: 0.10    # no copiar si el precio subió >10% desde su entrada
    min_wallet_score: 0.38
    min_copy_usdc_of_wallet: 300   # ignorar trades chicos de la wallet
    strong_score: 0.65        # una sola wallet dispara si score>=0.65
    strong_usdc: 1500         # ... y entró con >= 1500 USDC
    solo_big_usdc: 2500       # cualquier calificada dispara sola si mete >= 2500
    confirm_count: 2          # o si >=2 wallets calificadas coinciden
    # Wallets que NUNCA se copian, aunque pasen los filtros de score.
    # Backtest 2026-08-21: copiarlas dio retorno negativo sostenido.
    wallet_blacklist:
      - "0x6a72f61820b26b1fe4d956e17b6dc2a1ea3033ee"  # kch123: -19.7% en 38d, WR 48%
      - "0x17db3fcd93ba12d38382a0cade24b200185c5f6d"  # fengdubiying: sin evidencia positiva
      - "0x6d20c35f65d9899b6d6b74f8466e824580f9a165"  # Djdjdjekekek: -20.1% en 50 copias, WR 40% (esports en vivo, incopiable)
      - "0x2c335066fe58fe9237c3d3dc7b275c2a034a0563"  # -2.0% en 197 copias, WR 48% (deportes en vivo)
    # Consenso de posiciones (rutina diaria): entrar cuando >=N wallets top
    # SOSTIENEN la misma posición grande en mercados lentos, aunque no
    # hayamos visto el trade en vivo. Complementa la copia en tiempo real.
    holdings_consensus:
      enabled: true
      min_wallets: 2
      min_value_usdc: 1500        # posición mínima de cada wallet
      categories: [politics, economy, geopolitics, crypto]  # nada de deportes en vivo
      max_entry_price: 0.90
  news_trading:
    enabled: false            # fase 3: requiere ANTHROPIC_API_KEY y research/
  # Valor en cripto: modelo de opciones (precio spot + volatilidad real de
  # Coinbase) vs la probabilidad implícita del mercado de Polymarket.
  crypto_value:
    enabled: true
    budget_pct: 0.20
    base_pct_per_trade: 0.05
    min_edge: 0.08            # el modelo debe discrepar >=8 puntos de prob.
    max_entry_price: 0.85
    min_days_to_resolution: 0.5
    max_days_to_resolution: 45
    vol_lookback_days: 30
